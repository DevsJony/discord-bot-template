name: Build

on:
  push:
    # master branch already handles building on itself
    branches-ignore: ["master"]
  pull_request:
  workflow_call:

jobs:
  build:
    name: Test and build

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
